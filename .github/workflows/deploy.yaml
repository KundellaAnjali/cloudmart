name: CloudMart Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  PARAM_FILE: parameters/parameters.json

jobs:

  # ==========================================================
  # SINGLE LINT JOB
  # ==========================================================

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cfn-lint
        run: |
          pip install cfn-lint

      - name: Lint CloudFormation and SAM Templates
        run: |
          echo "Linting Network Stack..."
          cfn-lint --non-zero-exit-code error cloudformation/network-stack.yaml

          echo "Linting Data Stack..."
          cfn-lint --non-zero-exit-code error cloudformation/data-stack.yaml

          echo "Linting IAM Stack..."
          cfn-lint --non-zero-exit-code error cloudformation/iam-stack.yaml

          echo "Linting Auth Stack..."
          cfn-lint --non-zero-exit-code error cloudformation/auth-stack.yaml

          echo "Linting Product Stack..."
          cfn-lint --non-zero-exit-code error cloudformation/product-stack.yaml

          echo "Linting Order Stack..."
          cfn-lint --non-zero-exit-code error cloudformation/orders-stack.yaml

          echo "Linting Monitor Stack..."
          cfn-lint --non-zero-exit-code error cloudformation/monitor-stack.yaml

          echo "All CloudFormation templates passed linting."


  # ==========================================================
  # NETWORK STACK
  # ==========================================================

  deploy-network:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_ROLE }}
          aws-region: ap-south-1

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[0].ParameterValue' ${{ env.PARAM_FILE }})" >> $GITHUB_ENV

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-stack \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


  # ==========================================================
  # DATA STACK
  # ==========================================================

  deploy-data:
    needs: deploy-network
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_ROLE }}
          aws-region: ap-south-1

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[0].ParameterValue' ${{ env.PARAM_FILE }})" >> $GITHUB_ENV

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-stack \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


  # ==========================================================
  # IAM STACK
  # ==========================================================

  deploy-iam:
    needs: deploy-data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_ROLE }}
          aws-region: ap-south-1

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[0].ParameterValue' ${{ env.PARAM_FILE }})" >> $GITHUB_ENV

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-stack \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


  # ==========================================================
  # AUTH STACK
  # ==========================================================

  deploy-auth:
    needs: deploy-iam
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_ROLE }}
          aws-region: ap-south-1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[0].ParameterValue' ${{ env.PARAM_FILE }})" >> $GITHUB_ENV

      - name: Validate Auth Stack
        run: |
          sam validate \
            --template-file cloudformation/auth-stack.yaml

      - name: Build Auth Stack
        run: |
          sam build \
            --template-file cloudformation/auth-stack.yaml

      - name: Deploy Auth Stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-auth-stack \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --region ap-south-1

      - name: Run Schema Initialization
        run: |
          aws lambda invoke \
            --function-name cloudmart-schema-init-${{ env.ENVIRONMENT }} \
            response.json

          cat response.json


  # ==========================================================
  # PRODUCT STACK
  # ==========================================================

  deploy-product:
    needs: deploy-auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_ROLE }}
          aws-region: ap-south-1

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[0].ParameterValue' ${{ env.PARAM_FILE }})" >> $GITHUB_ENV

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate Product Stack
        run: |
          sam validate \
            --template-file cloudformation/product-stack.yaml

      - name: Build Product Stack
        run: |
          sam build \
            --template-file cloudformation/product-stack.yaml

      - name: Deploy Product Stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-product-stack \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --region ap-south-1


  # ==========================================================
  # ORDER STACK
  # ==========================================================

  deploy-order:
    needs: deploy-product
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_ROLE }}
          aws-region: ap-south-1

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[0].ParameterValue' ${{ env.PARAM_FILE }})" >> $GITHUB_ENV

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate Order Stack
        run: |
          sam validate \
            --template-file cloudformation/orders-stack.yaml

      - name: Build Order Stack
        run: |
          sam build \
            --template-file cloudformation/orders-stack.yaml

      - name: Deploy Order Stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-orders-stack \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --region ap-south-1


  # ==========================================================
  # MONITOR STACK
  # ==========================================================

  deploy-monitor:
    needs: deploy-order
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_ROLE }}
          aws-region: ap-south-1

      - name: Load Parameters
        run: |
          echo "ENVIRONMENT=$(jq -r '.[0].ParameterValue' ${{ env.PARAM_FILE }})" >> $GITHUB_ENV

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate Monitor Stack
        run: |
          sam validate \
            --template-file cloudformation/monitor-stack.yaml

      - name: Build Monitor Stack
        run: |
          sam build \
            --template-file cloudformation/monitor-stack.yaml

      - name: Deploy Monitor Stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-monitor-stack \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --region ap-south-1