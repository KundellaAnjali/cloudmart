name: Orders Deployment

on:
  push:
    branches:
      - orders

permissions:
  id-token: write
  contents: read

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint IAM Stack
        run: |
          cfn-lint cloudformation/iam-stack.yaml

      - name: Lint Product Stack
        run: |
          cfn-lint cloudformation/product-stack.yaml

      - name: Lint Orders Stack
        run: |
          cfn-lint cloudformation/orders-stack.yaml

  deploy:
    needs: lint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_ROLE }}
          aws-region: ap-south-1

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      # IAM STACK

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # PRODUCT STACK

      - name: Validate Product Stack
        run: |
          sam validate \
            --template-file cloudformation/product-stack.yaml

      - name: Build Product Stack
        run: |
          sam build \
            --template-file cloudformation/product-stack.yaml

      - name: Deploy Product Stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-product-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --region ap-south-1

      # ORDERS STACK

      - name: Validate Orders Stack
        run: |
          sam validate \
            --template-file cloudformation/orders-stack.yaml

      - name: Build Orders Stack
        run: |
          sam build \
            --template-file cloudformation/orders-stack.yaml

      - name: Deploy Orders Stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-orders-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --region ap-south-1

      - name: Check IAM Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-stack

      - name: Check Product Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-product-stack

      - name: Check Orders Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-orders-stack

      - name: Show Stack Events On Failure
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-iam-stack || true

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-product-stack || true

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-orders-stack || true