name: Authorization Stack

on:
  push:
    branches:
      - auth

permissions:
  id-token: write
  contents: read

jobs:

  lint-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint Auth Stack
        run: |
          cfn-lint --non-zero-exit-code error cloudformation/auth-stack.yaml

  deploy-auth:
    needs: lint-auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_ROLE }}
          aws-region: ap-south-1

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Validate Auth Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/auth-stack.yaml

      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/auth-stack.yaml \
            --stack-name cloudmart-auth-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Check Auth Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-auth-stack

      - name: Show Stack Events On Failure
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-auth-stack