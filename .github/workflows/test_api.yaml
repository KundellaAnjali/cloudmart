name: CloudMart Application Deploy

on:
  push:
    branches:
      - api

permissions:
  id-token: write
  contents: read

jobs:

  lint-application:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cfn-lint
        run: |
          pip install cfn-lint

      - name: Lint Application Stack
        run: |
          cfn-lint --non-zero-exit-code error cloudformation/application-stack.yaml

  deploy-application:
    needs: lint-application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_ROLE }}
          aws-region: ap-south-1

      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity

      - name: Validate Application Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/application-stack.yaml

      - name: Deploy Application Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/application-stack.yaml \
            --stack-name cloudmart-application-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Check Application Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-stack

      - name: Show Stack Events On Failure
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-application-stack