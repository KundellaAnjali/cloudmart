AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart Data Stack

Resources:

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CloudMart Database Subnet Group
      SubnetIds:
        - Fn::ImportValue: CloudMart-Private-Subnet-A-ID
        - Fn::ImportValue: CloudMart-Private-Subnet-B-ID
      Tags:
        - Key: Name
          Value: CloudMartDBSubnetGroup

  CloudMartRDS:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: cloudmart-db

      Engine: mysql

      DBInstanceClass: db.t3.micro

      AllocatedStorage: 20

      DBName: cloudmart

      MasterUsername: admin

      MasterUserPassword: CloudMart1234!

      PubliclyAccessible: false

      MultiAZ: false

      BackupRetentionPeriod: 0

      DBSubnetGroupName: !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:
        - Fn::ImportValue: CloudMart-RDS-SG

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cloudmart-reports-${AWS::AccountId}

  AuthTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/dev/auth/token
      Type: String
      Value: cloudmart123

  DBUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/dev/db/username
      Type: String
      Value: admin

  DBPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/dev/db/password
      Type: String
      Value: CloudMart1234!

  DBHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/dev/db/host
      Type: String
      Value: !GetAtt CloudMartRDS.Endpoint.Address

  DBNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/dev/db/name
      Type: String
      Value: cloudmart

  StockThresholdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/dev/inventory/stock-threshold
      Type: String
      Value: "10"

  ReportsBucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/dev/s3/reports-bucket
      Type: String
      Value: !Ref ReportsBucket

Outputs:

  DBSubnetGroupName:
    Description: DB Subnet Group Name
    Value: !Ref CloudMartDBSubnetGroup
    Export:
      Name: CloudMart-DBSubnetGroup

  RDSEndpoint:
    Description: RDS Endpoint
    Value: !GetAtt CloudMartRDS.Endpoint.Address
    Export:
      Name: CloudMart-RDS-Endpoint

  ReportsBucketName:
    Description: Reports Bucket Name
    Value: !Ref ReportsBucket
    Export:
      Name: CloudMart-Reports-Bucket