AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart Data Stack

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod

Resources:

  CloudMartKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CloudMart secrets
      EnableKeyRotation: true

  CloudMartKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${Environment}-cloudmart-kms"
      TargetKeyId: !Ref CloudMartKMSKey

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CloudMart Database Subnet Group
      SubnetIds:
        - Fn::ImportValue: !Sub "${Environment}-CloudMart-Private-Subnet-A-ID"
        - Fn::ImportValue: !Sub "${Environment}-CloudMart-Private-Subnet-B-ID"
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-CloudMartDBSubnetGroup"

  CloudMartRDS:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${Environment}-cloudmart-db"
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      DBName: cloudmart
      MasterUsername: admin
      # Resolves password from SSM dynamic reference using ssm-secure
      MasterUserPassword: !Sub '{{resolve:ssm-secure:/cloudmart/${Environment}/db/password:1}}'
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      DBSubnetGroupName: !Ref CloudMartDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub "${Environment}-CloudMart-RDS-SG"

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Environment}-cloudmart-reports-${AWS::AccountId}"

  DBUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/db/username
      Type: String
      Value: admin

  DBHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/db/host
      Type: String
      Value: !GetAtt CloudMartRDS.Endpoint.Address

  DBNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/db/name
      Type: String
      Value: cloudmart

  StockThresholdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/inventory/stock-threshold
      Type: String
      Value: "10"

  ReportsBucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/s3/reports-bucket
      Type: String
      Value: !Ref ReportsBucket

Outputs:

  DBSubnetGroupName:
    Description: DB Subnet Group Name
    Value: !Ref CloudMartDBSubnetGroup
    Export:
      Name: !Sub "${Environment}-CloudMart-DBSubnetGroup"

  RDSEndpoint:
    Description: RDS Endpoint
    Value: !GetAtt CloudMartRDS.Endpoint.Address
    Export:
      Name: !Sub "${Environment}-CloudMart-RDS-Endpoint"

  ReportsBucketName:
    Description: Reports Bucket Name
    Value: !Ref ReportsBucket
    Export:
      Name: !Sub "${Environment}-CloudMart-Reports-Bucket"

  CloudMartKMSKeyArn:
    Description: CloudMart KMS Key ARN
    Value: !GetAtt CloudMartKMSKey.Arn
    Export:
      Name: !Sub "${Environment}-CloudMart-KMS-Key-Arn"