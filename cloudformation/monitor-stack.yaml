AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: CloudMart Monitoring Stack

Parameters:

  Environment:
    Type: String
    Default: dev

Resources:

  ReportLambdaFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12

    Properties:

      FunctionName: !Sub cloudmart-report-function-${Environment}

      Runtime: python3.12

      Handler: index.handler

      CodeUri: ../lambdas/report/

      Role:
        Fn::ImportValue: ReportLambdaRoleArn

      Timeout: 60

      MemorySize: 512

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: CloudMart-Lambda-SG

        SubnetIds:
          - Fn::ImportValue: CloudMart-Private-Subnet-A-ID
          - Fn::ImportValue: CloudMart-Private-Subnet-B-ID

      Events:

        DailyReport:

          Type: Schedule

          Properties:

            Name: !Sub cloudmart-daily-report-${Environment}

            Schedule: rate(1 day)

            Enabled: true

  CloudMartDashboard:
    Type: AWS::CloudWatch::Dashboard

    Properties:

      DashboardName: cloudmart-operations

      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Product Metrics",
                "metrics": [
                  ["CloudMart","ProductsCreated"],
                  ["CloudMart","InventoryUpdated"],
                  ["CloudMart","LowStockProducts"]
                ],
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Order Metrics",
                "metrics": [
                  ["CloudMart","OrdersCreated"],
                  ["CloudMart","OrderValue"],
                  ["CloudMart","InventoryDeductions"],
                  ["CloudMart","FailedOrders"]
                ],
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Report Metrics",
                "metrics": [
                  ["CloudMart","ReportsGenerated"],
                  ["CloudMart","ReportUploadSuccess"],
                  ["CloudMart","ReportGenerationFailures"]
                ],
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Authorization Metrics",
                "metrics": [
                  ["CloudMart","AuthorizedRequests"],
                  ["CloudMart","UnauthorizedRequests"]
                ],
                "region": "${AWS::Region}"
              }
            }
          ]
        }

  AlarmNotificationTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName: cloudmart-monitoring-alerts

  AlarmNotificationSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      Protocol: email
      Endpoint: kundella.anjali@omc.com
      TopicArn: !Ref AlarmNotificationTopic

  FailedOrdersAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: CloudMart-FailedOrders
      Namespace: CloudMart
      MetricName: FailedOrders
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlarmNotificationTopic

  UnauthorizedRequestsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: CloudMart-UnauthorizedRequests
      Namespace: CloudMart
      MetricName: UnauthorizedRequests
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlarmNotificationTopic

  ReportGenerationFailuresAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: CloudMart-ReportGenerationFailures
      Namespace: CloudMart
      MetricName: ReportGenerationFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlarmNotificationTopic

  LowStockProductsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: CloudMart-LowStockProducts
      Namespace: CloudMart
      MetricName: LowStockProducts
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlarmNotificationTopic

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:
      InstanceProfileName: CloudMart-Dashboard-Profile
      Roles:
        - CloudMart-EC2Dashboard-Role

  DashboardEC2:
    Type: AWS::EC2::Instance

    Properties:

      InstanceType: t3.micro

      ImageId: ami-0f58b397bc5c1f2e8

      IamInstanceProfile: !Ref DashboardInstanceProfile

      SecurityGroupIds:
        - Fn::ImportValue: CloudMart-EC2-SG

      SubnetId:
        Fn::ImportValue: CloudMart-Public-Subnet-ID

      Tags:
        - Key: Name
          Value: CloudMart-Dashboard

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash

          yum update -y

          yum install -y git python3 python3-pip

          cd /home/ec2-user

          git clone https://github.com/KundellaAnjali/cloudmart.git

          cd cloudmart/dashboard

          pip3 install -r requirements.txt

          cat > /etc/systemd/system/cloudmart-dashboard.service << 'EOF'
          [Unit]
          Description=CloudMart Dashboard
          After=network.target

          [Service]
          User=ec2-user
          WorkingDirectory=/home/ec2-user/cloudmart/dashboard
          ExecStart=/usr/bin/python3 /home/ec2-user/cloudmart/dashboard/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload

          systemctl enable cloudmart-dashboard

          systemctl start cloudmart-dashboard
        

Outputs:

  ReportLambdaArn:
    Description: Report Lambda ARN
    Value: !GetAtt ReportLambdaFunction.Arn
    Export:
      Name: CloudMart-Report-Lambda-Arn

  DashboardPublicIP:
    Description: Dashboard EC2 Public IP

    Value: !GetAtt DashboardEC2.PublicIp