AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: CloudMart Monitoring Stack

Parameters:

  Environment:
    Type: String
    Default: dev

Resources:

  ReportLambdaFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12

    Properties:

      FunctionName: !Sub cloudmart-report-function-${Environment}

      Runtime: python3.12

      Handler: index.handler

      CodeUri: ../lambdas/report/

      Role:
        Fn::ImportValue: ReportLambdaRoleArn

      Timeout: 60

      MemorySize: 512

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: CloudMart-Lambda-SG

        SubnetIds:
          - Fn::ImportValue: CloudMart-Private-Subnet-A-ID
          - Fn::ImportValue: CloudMart-Private-Subnet-B-ID

      Events:

        DailyReport:

          Type: Schedule

          Properties:

            Name: !Sub cloudmart-daily-report-${Environment}

            Schedule: rate(1 day)

            Enabled: true

  CloudMartDashboard:
    Type: AWS::CloudWatch::Dashboard

    Properties:

      DashboardName: cloudmart-operations

      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Product Metrics",
                "metrics": [
                  ["CloudMart","ProductsCreated"],
                  ["CloudMart","InventoryUpdated"],
                  ["CloudMart","LowStockProducts"]
                ],
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Order Metrics",
                "metrics": [
                  ["CloudMart","OrdersCreated"],
                  ["CloudMart","OrderValue"],
                  ["CloudMart","InventoryDeductions"],
                  ["CloudMart","FailedOrders"]
                ],
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Report Metrics",
                "metrics": [
                  ["CloudMart","ReportsGenerated"],
                  ["CloudMart","ReportUploadSuccess"],
                  ["CloudMart","ReportGenerationFailures"]
                ],
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Authorization Metrics",
                "metrics": [
                  ["CloudMart","AuthorizedRequests"],
                  ["CloudMart","UnauthorizedRequests"]
                ],
                "region": "${AWS::Region}"
              }
            }
          ]
        }

  AlarmNotificationTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName: cloudmart-monitoring-alerts

  AlarmNotificationSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      Protocol: email
      Endpoint: kundella.anjali@omc.com
      TopicArn: !Ref AlarmNotificationTopic

  FailedOrdersAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: CloudMart-FailedOrders
      Namespace: CloudMart
      MetricName: FailedOrders
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlarmNotificationTopic

  UnauthorizedRequestsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: CloudMart-UnauthorizedRequests
      Namespace: CloudMart
      MetricName: UnauthorizedRequests
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlarmNotificationTopic

  ReportGenerationFailuresAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: CloudMart-ReportGenerationFailures
      Namespace: CloudMart
      MetricName: ReportGenerationFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlarmNotificationTopic

  LowStockProductsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: CloudMart-LowStockProducts
      Namespace: CloudMart
      MetricName: LowStockProducts
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlarmNotificationTopic

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:
      InstanceProfileName: CloudMart-Dashboard-Profile
      Roles:
        - CloudMart-EC2Dashboard-Role

  Ec2DashboardV2:
    Type: AWS::EC2::Instance

    Properties:

      InstanceType: t3.micro

      # Amazon Linux 2023 AMI (replace with latest AMI ID for your region if needed)
      ImageId: ami-0e35ddab05955cf57

      IamInstanceProfile: !Ref DashboardInstanceProfile

      SecurityGroupIds:
        - Fn::ImportValue: CloudMart-EC2-SG

      SubnetId:
        Fn::ImportValue: CloudMart-Public-Subnet-ID

      Tags:
        - Key: Name
          Value: Ec2DashboardV2

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash

          apt update -y

          apt install -y \
            git \
            nginx \
            python3 \
            python3-pip \
            mariadb-client

          cd /home/ubuntu

          git clone https://github.com/KundellaAnjali/cloudmart.git

          cd cloudmart

          git checkout monitor

          cd dashboard

          pip3 install --break-system-packages -r requirements.txt

          cat > /etc/systemd/system/cloudmart-dashboard.service << 'EOF'
          [Unit]
          Description=CloudMart Dashboard
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/home/ubuntu/cloudmart/dashboard
          ExecStart=/usr/bin/python3 /home/ubuntu/cloudmart/dashboard/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable cloudmart-dashboard
          systemctl start cloudmart-dashboard

          cat > /etc/nginx/sites-available/cloudmart << 'EOF'
          server {

              listen 80;

              server_name _;

              location / {

                  proxy_pass http://127.0.0.1:5000;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

              }

          }
          EOF

          rm -f /etc/nginx/sites-enabled/default

          ln -s /etc/nginx/sites-available/cloudmart \
          /etc/nginx/sites-enabled/cloudmart

          systemctl enable nginx

          systemctl restart nginx
Outputs:

  ReportLambdaArn:
    Description: Report Lambda ARN
    Value: !GetAtt ReportLambdaFunction.Arn
    Export:
      Name: CloudMart-Report-Lambda-Arn

  DashboardPublicIP:
    Description: Dashboard EC2 Public IP

    Value: !GetAtt Ec2DashboardV2.PublicIp