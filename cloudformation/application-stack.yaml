AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart Application Stack

Resources:

  ProductLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudmart-product-lambda

      Runtime: python3.12
      Handler: index.handler

      Role:
        Fn::ImportValue: ProductLambdaRoleArn

      Timeout: 30

      Code:
        ZipFile: |
          import json

          def handler(event, context):
              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "message": "Product Lambda Working"
                  })
              }

  ProductApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: CloudMartProductApi

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ProductApi
      ParentId: !GetAtt ProductApi.RootResourceId
      PathPart: products

  ProductLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductLambda
      Principal: apigateway.amazonaws.com

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: LambdaAuthorizerArn
      Principal: apigateway.amazonaws.com

  ProductAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CloudMartAuthorizer
      RestApiId: !Ref ProductApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 300

      AuthorizerUri:
        Fn::Sub:
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue: LambdaAuthorizerArn


  GetProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProductApi

      ResourceId: !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ProductAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri: !Sub >
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambda.Arn}/invocations

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetProductsMethod

    Properties:
      RestApiId: !Ref ProductApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ProductApi
      DeploymentId: !Ref ApiDeployment
      StageName: dev

Outputs:

  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn

  ApiId:
    Description: API Gateway ID
    Value: !Ref ProductApi

  ProductsApiUrl:
    Description: Products API URL
    Value: !Sub
      - https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev/products
      - Api: !Ref ProductApi