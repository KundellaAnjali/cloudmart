AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart Application Stack

Resources:

  ProductLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudmart-product-lambda

      Runtime: python3.12
      Handler: index.handler

      Role:
        Fn::ImportValue: ProductLambdaRoleArn

      Timeout: 30

      Code:
        ZipFile: |
          import json

          def handler(event, context):
              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "message": "Product Lambda Working"
                  })
              }

Outputs:

  ProductLambdaArn:
    Value: !GetAtt ProductLambda.Arn