ProductLambda:
  Type: AWS::Lambda::Function
  Properties:
    FunctionName: cloudmart-product-lambda

    Runtime: python3.12
    Handler: index.handler

    Role:
      Fn::ImportValue: ProductLambdaRoleArn

    Timeout: 30

    Code:
      ZipFile: |
        import json

        def handler(event, context):
            return {
                "statusCode": 200,
                "body": json.dumps({
                    "message": "Product Lambda Working"
                })
            }
Outputs:

  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn