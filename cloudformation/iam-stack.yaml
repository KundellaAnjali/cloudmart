AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart IAM Stack

Resources:

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudMart-LambdaAuthorizer-Role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: LambdaAuthorizerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/dev/auth/customer-token
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/dev/auth/product-token
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/dev/auth/admin-token

  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudMart-ProductLambda-Role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:
        - PolicyName: ProductLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/dev/db/*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/dev/inventory/*

              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default

  OrderProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudMart-OrderProcessor-Role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:
        - PolicyName: OrderProcessorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/dev/db/*

              

              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default

  ReportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudMart-ReportLambda-Role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:
        - PolicyName: ReportLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/dev/*

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub arn:aws:s3:::cloudmart-reports-${AWS::AccountId}/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::cloudmart-reports-${AWS::AccountId}

  EC2DashboardRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudMart-EC2Dashboard-Role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: EC2DashboardPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::cloudmart-reports-${AWS::AccountId}/*

              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::cloudmart-reports-${AWS::AccountId}

              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: "*"
  

Outputs:



  LambdaAuthorizerRoleArn:
    Description: Lambda Authorizer Role ARN
    Value: !GetAtt LambdaAuthorizerRole.Arn
    Export:
      Name: LambdaAuthorizerRoleArn

  ProductLambdaRoleArn:
    Description: Product Lambda Role ARN
    Value: !GetAtt ProductLambdaRole.Arn
    Export:
      Name: ProductLambdaRoleArn

  OrderProcessorRoleArn:
    Description: Order Processor Role ARN
    Value: !GetAtt OrderProcessorRole.Arn
    Export:
      Name: OrderProcessorRoleArn

  ReportLambdaRoleArn:
    Description: Report Lambda Role ARN
    Value: !GetAtt ReportLambdaRole.Arn
    Export:
      Name: ReportLambdaRoleArn

  EC2DashboardRoleArn:
    Description: EC2 Dashboard Role ARN
    Value: !GetAtt EC2DashboardRole.Arn
    Export:
      Name: EC2DashboardRoleArn