AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart Application Stack

Resources:

  LambdaAuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudmart-authorizer
      Runtime: python3.12
      Handler: index.handler

      Role:
        Fn::ImportValue: LambdaAuthorizerRoleArn

      Timeout: 30

      Code:
        ZipFile: |
          import boto3

          ssm = boto3.client('ssm')

          def handler(event, context):

              token = event.get("authorizationToken", "")

              response = ssm.get_parameter(
                  Name="/cloudmart/dev/auth/token",
                  WithDecryption=True
              )

              valid_token = response["Parameter"]["Value"]

              if token == f"Bearer {valid_token}":
                  return {
                      "principalId": "cloudmart",
                      "policyDocument": {
                          "Version": "2012-10-17",
                          "Statement": [
                              {
                                  "Action": "execute-api:Invoke",
                                  "Effect": "Allow",
                                  "Resource": "*"
                              }
                          ]
                      }
                  }

              raise Exception("Unauthorized")

Outputs:

  LambdaAuthorizerArn:
    Value: !GetAtt LambdaAuthorizerFunction.Arn
    Export:
      Name: LambdaAuthorizerArn
            