AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudMart Product Stack

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

Resources:

  ProductApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: cloudmart-product-api
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CloudMartAuthorizer
        Authorizers:
          CloudMartAuthorizer:
            FunctionArn:
              Fn::ImportValue: LambdaAuthorizerArn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization
            AuthorizerResultTtlInSeconds: 0

  ProductLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloudmart-product-function
      Runtime: python3.12
      Handler: index.handler
      CodeUri: ../lambdas/product/
      Role:
        Fn::ImportValue: ProductLambdaRoleArn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: CloudMart-Lambda-SG
        SubnetIds:
          - Fn::ImportValue: CloudMart-Private-Subnet-A-ID
          - Fn::ImportValue: CloudMart-Private-Subnet-B-ID
      Events:
        GetProducts:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /products
            Method: GET

        GetProductById:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /products/{id}
            Method: GET

        CreateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /products
            Method: POST

        UpdateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /products/{id}
            Method: PATCH

        DeleteProduct:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /products/{id}
            Method: DELETE


  OrderLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloudmart-order-function
      Runtime: python3.12
      Handler: index.handler
      CodeUri: ../lambdas/order/
      Role:
        Fn::ImportValue: OrderProcessorRoleArn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: CloudMart-Lambda-SG
        SubnetIds:
          - Fn::ImportValue: CloudMart-Private-Subnet-A-ID
          - Fn::ImportValue: CloudMart-Private-Subnet-B-ID
      Events:
        CreateCustomer:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /customers
            Method: POST

        GetCustomers:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /customers
            Method: GET

        GetCustomerById:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /customers/{id}
            Method: GET

        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /orders
            Method: POST

        GetOrders:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /orders
            Method: GET

        GetOrderById:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /orders/{id}
            Method: GET

        CancelOrder:
          Type: Api
          Properties:
            RestApiId: !Ref ProductApi
            Path: /orders/{id}
            Method: PATCH

Outputs:


  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambdaFunction.Arn
    Export:
      Name: ProductLambdaArn

  ProductApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${ProductApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  ProductApiId:
    Description: API Gateway ID
    Value: !Ref ProductApi
    Export:
      Name: ProductApiId

 

  OrderLambdaArn:
    Description: Order Lambda ARN
    Value: !GetAtt OrderLambdaFunction.Arn
    Export:
      Name: CloudMart-Order-Lambda-Arn