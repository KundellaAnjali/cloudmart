{% extends "layout.html" %}

{% block content %}

<h2>📦 Products & Inventory</h2>

<br>

<table>

<tr>

<th>ID</th>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>

</tr>

{% for product in products %}

<tr>

<td>{{ product.product_id }}</td>
<td>{{ product.product_name }}</td>
<td>{{ product.category }}</td>
<td>₹{{ product.price }}</td>
<td>{{ product.stock_count }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
