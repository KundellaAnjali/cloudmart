{% extends "layout.html" %}

{% block content %}

<h2>📊 Dashboard</h2>

<br>

<div class="kpis">

    <div class="kpi-card">
        <h3>Total Products</h3>
        <p>{{ total_products }}</p>
    </div>

    <div class="kpi-card">
        <h3>Total Orders</h3>
        <p>{{ total_orders }}</p>
    </div>

    <div class="kpi-card">
        <h3>Total Customers</h3>
        <p>{{ total_customers }}</p>
    </div>

    <div class="kpi-card">
        <h3>Total Revenue</h3>
        <p>₹{{ revenue }}</p>
    </div>

    <div class="kpi-card">
        <h3>Low Stock Products</h3>
        <p>{{ low_stock }}</p>
    </div>

    <div class="kpi-card">
        <h3>Failed Orders</h3>
        <p>{{ failed_orders }}</p>
    </div>

</div>

{% endblock %}
