{% extends "layout.html" %}

{% block content %}

<h2>🛒 Orders</h2>

<br>

<table>

<tr>

<th>Order ID</th>
<th>Customer ID</th>
<th>Status</th>
<th>Amount</th>

</tr>

{% for order in orders %}

<tr>

<td>{{ order.order_id }}</td>
<td>{{ order.customer_id }}</td>
<td>{{ order.order_status }}</td>
<td>₹{{ order.total_amount }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
