<!DOCTYPE html>
<html>
<head>

<title>CloudMart Operations Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6f9;
}

.header{

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e40af
    );

    color:white;

    text-align:center;

    padding:30px;
}

.header h1{
    font-size:50px;
}

.main{

    display:flex;

    min-height:
    calc(100vh - 120px);
}

.sidebar{

    width:280px;

    background:white;

    box-shadow:
    2px 0px 10px rgba(0,0,0,.1);
}

.sidebar a{

    display:block;

    padding:20px;

    text-decoration:none;

    color:#1e293b;

    font-size:18px;

    transition:.3s;
}

.sidebar a:hover{

    background:#eff6ff;

    color:#2563eb;
}

.content{

    flex:1;

    padding:30px;
}

.card{

    background:white;

    border-radius:20px;

    padding:30px;

    box-shadow:
    0 5px 20px rgba(0,0,0,.1);
}

table{

    width:100%;

    border-collapse:collapse;

    background:white;
}

th{

    background:#2563eb;

    color:white;

    padding:15px;
}

td{

    padding:12px;

    border-bottom:1px solid #ddd;
}

.kpis{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:20px;
}

.kpi-card{

    background:white;

    padding:20px;

    border-radius:15px;

    text-align:center;

    box-shadow:
    0 3px 10px rgba(0,0,0,.1);
}

.kpi-card p{

    font-size:28px;

    color:#2563eb;

    font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

    <h1>☁️ CloudMart Operations Portal</h1>

</div>

<div class="main">

    <div class="sidebar">

        /📊 Dashboard</a>

        /products
            📦 Products & Inventory
        </a>

        /orders
            🛒 Orders
        </a>

        /customers
            👥 Customers
        </a>

        /reports
            📄 Reports
        </a>

        /metrics
            📈 CloudWatch Metrics
        </a>

        /alerts
            🚨 Alerts
        </a>

        /health
            ❤️ System Health
        </a>

    </div>

    <div class="content">

        {% block content %}
        {% endblock %}

    </div>

</div>

</body>

</html>
