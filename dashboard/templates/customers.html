{% extends "layout.html" %}

{% block content %}

<h2>👥 Customers</h2>

<br>

<table>

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Role</th>

</tr>

{% for customer in customers %}

<tr>

<td>{{ customer.customer_id }}</td>
<td>{{ customer.customer_name }}</td>
<td>{{ customer.customer_email }}</td>
<td>{{ customer.role }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
